name: Forex 15m scanner

on:
  schedule:
    # Every 15 min, 5 minutes after the stock scanner so the two never clash. Times are UTC.
    # Forex/gold trade from Sunday evening to Friday evening (New York 5 pm).
    - cron: "7,22,37,52 21-23 * * 0"   # Sunday evening (market opens)
    - cron: "7,22,37,52 * * * 1-4"     # Monday to Thursday, all day
    - cron: "7,22,37,52 0-22 * * 5"    # Friday until the market closes
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run forex scanner
        run: python scanner.py ${{ inputs.test && '--test' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYMBOLS_FILE: forex_symbols.txt
          STATE_FILE: state_forex.json
          DAILY_FILTER: "0"          # 0 = ignore the daily arrow
          ARROWS_IN_ROW: "2"         # 2 = email from the 2nd same-direction arrow onward
          ALERT_PREFIX: "Forex arrow alert"
      - name: Save state (prevents duplicate emails)
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state_forex.json || true
          git diff --cached --quiet || (git commit -m "update forex state" && git pull --rebase && git push)
