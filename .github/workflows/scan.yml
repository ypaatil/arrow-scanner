name: Arrow scanner

on:
  schedule:
    # Every 15 min, just after each 15m candle closes (UTC). Forex trades Sunday evening to Friday.
    - cron: "2,17,32,47 * * * 0-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scanner
        run: python scanner.py ${{ inputs.test && '--test' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Save state (prevents duplicate emails)
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
