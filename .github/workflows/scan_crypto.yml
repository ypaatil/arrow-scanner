name: Crypto 15m scanner

on:
  schedule:
    # Every 15 minutes, 24 hours a day, 7 days a week (crypto never closes). Times are UTC.
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run crypto scanner
        run: python scanner.py ${{ inputs.test && '--test' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYMBOLS_FILE: crypto_symbols.txt
          STATE_FILE: state_crypto.json
          DAILY_FILTER: "1"          # 1 = daily arrow must match, 0 = ignore the daily arrow
          ARROWS_IN_ROW: "2"         # 2 = email from the 2nd same-direction arrow onward
          ALERT_PREFIX: "Crypto arrow alert"
      - name: Save state (prevents duplicate emails)
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state_crypto.json || true
          git diff --cached --quiet || (git commit -m "update crypto state" && git pull --rebase && git push)
